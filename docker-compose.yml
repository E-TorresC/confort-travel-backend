services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: confort-travel-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    networks:
      - confort-network

  backend:
    build: .
    container_name: confort-travel-backend-app
    ports:
      - "8080:8080"
    environment:
      # Configuramos la URL para que el backend encuentre al contenedor sqlserver en la red interna
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:sqlserver://sqlserver:1433;databaseName=confort_travel;encrypt=true;trustServerCertificate=true;
      - DB_USERNAME=sa
      - DB_PASSWORD=${MSSQL_SA_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    depends_on:
      - sqlserver
    restart: on-failure
    networks:
      - confort-network

volumes:
  sqlserver_data:

networks:
  confort-network:
    driver: bridge
spring:
  jackson:
    time-zone: UTC
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}

confort:
  travel:
    scheduler:
      check-in:
        fixed-delay-ms: 10000

# Configuración de Actuator (Monitoreo)
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,mappings,env"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

cors:
  allowed-origins: "http://localhost:4200"